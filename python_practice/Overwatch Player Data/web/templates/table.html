<!DOCTYPE html>
<html>
<head>
    <title>Overwatch Stats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">

    <!-- Table dependencies -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.css">
    <!-- jQuery + DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.js"></script>
</head>
<body>
    <ul class="navbar-custom">
        <div class="container">
            <li><a href="/" class="nav-links">Home</a></li>
            <li><a href="/table" class="nav-links">Table</a></li>
            <li><a href="#contact" class="nav-links">Top</a></li>
            <li><a href="#about" class="nav-links">Blah blah blah</a></li>
        </div>
    </ul>

    <div class="container d-flex flex-column mb-4" style="height: calc(100vh - 15vh);">
        <h1 class="mb-4 text-center" id="title-header"><i>Overwatch Insights - NinjaTacoooo</i></h1>

            <div class="row flex-grow-1">
            <div class="col-12 d-flex flex-column">
                <div class="table-responsive flex-grow-1">
                    <table id="heroStatsTable" class="table table-striped table-bordered w-100">
                        <thead>
                            <tr>
                                <th>Hero</th>
                                <th>Role</th>
                                <th>Season</th>
                                <th>Games Played</th>
                                <th>Games Won</th>
                                <th>Damage Done</th>
                                <th>Healing Done</th>
                                <th>Eliminations</th>
                                <th>Assists</th>
                                <th>Deaths</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>

    <script src="/static/filter.js"></script>
    <script>
    $(document).ready(function () {
        $('#heroStatsTable').DataTable({
            ajax: {
                url: "/hero_stats",
                dataSrc: ""
            },
            columns: [
                { data: "Hero" },
                { data: "Role" },
                { data: "Season" },
                { data: "Games Played" },
                { data: "Games Won" },
                { data: "Damage Done" },
                { data: "Healing Done" },
                { data: "Eliminations" },
                { data: "Assists" },
                { data: "Deaths" }
            ],
            scrollY: $('.table-responsive').height(),  // Dynamically use container height
            scrollCollapse: true,
            paging: false,
            info: false
        });
    });
    </script>

</body>
</html>
