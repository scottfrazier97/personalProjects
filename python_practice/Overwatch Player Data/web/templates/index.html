<!DOCTYPE html>
<html>
<head>
    <title>Overwatch Stats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>
    <ul>
        <li><a href="#home" class="nav-links">Home</a></li>
        <li><a href="#news" class="nav-links">Table</a></li>
        <li><a href="#contact" class="nav-links">Top</a></li>
        <li><a href="#about" class="nav-links">Blah blah blah</a></li>
    </ul>

    <div class="container mt-5">
        <h1 class="mb-4 text-center">Hero Highlights</h1>

        <div class="row justify-content-start">
            <!-- Form container, 20% width approx -->
            <div class="col-md-3">
                <form id="filterForm" method="get" class="p-4 border rounded shadow bg-light">

                    <div class="text-center mb-3">
                        <img id="heroImage" src="" alt="Hero Image" class="img-fluid" style="border-radius:10px; margin-bottom:20px;">
                        <div id="result" style="font-weight:bold;"></div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">Role:</label>
                        <select id="role" name="role" class="form-select">
                            {% for r in roles %}
                            <option value="{{ r }}">{{ r }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="hero" class="form-label">Hero:</label>
                        <select id="hero" name="hero" class="form-select">
                            {% for h in heroes %}
                            <option value="{{ h }}">{{ h }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="season" class="form-label">Season:</label>
                        <select id="season" name="season" class="form-select">
                            {% for s in seasons %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="stat" class="form-label">Stat:</label>
                        <select id="stat" name="stat" class="form-select">
                            {% for st in stats %}
                            <option value="{{ st }}">{{ st }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="text-center mt-3">
                        <button id="show-button" type="submit" class="btn btn-primary btn-lg">Show</button>
                    </div>

                </form>
            </div>

            <div class="col-md-9">
                <div class="row">
                    <!-- Chart takes up 2/3 of the width -->
                    <div class="col-md-9 text-center mb-3">
                        <canvas id="statChart"></canvas>
                    </div>
                    <!-- Summary takes up 1/3 of the width -->
                    <div class="col-md-3 text-center mb-3">
                        <div id="summary"></div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>

    <script src="/static/filter.js"></script>

</body>
</html>
